      try {
        var s = JSON.parse(localStorage.getItem('nokk:settings:v1') || '{}');

      } catch (e) {}
    </script>

      @keyframes spl-fold{from{transform:scale(0)}}
      @keyframes spl-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion: reduce){#splash{display:none}}
