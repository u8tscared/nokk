name: Tests

# Lancés à la main seulement (onglet Actions > Tests > Run workflow) : les vérifications, on les fait nous-mêmes.
# La mise en ligne est faite par Cloudflare Pages à chaque push sur main (https://nokkapp.fr).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
